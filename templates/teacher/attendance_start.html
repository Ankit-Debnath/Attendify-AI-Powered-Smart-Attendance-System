{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Start Attendance</h2>
        <p class="page-subtitle">{{ class_.class_name }} ({{ class_.subject }})</p>
    </div>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('teacher_attendance_start', class_id=class_.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="duration">Session Duration (minutes)</label>
                <input class="form-control" type="number" id="duration" name="duration" value="10" min="1" max="60" required>
                <small class="text-sec mt-2" style="display: block;">The session will automatically expire after this duration.</small>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary" style="background: var(--success); width: 100%;">Start Session</button>
                <a href="{{ url_for('teacher_class_detail', class_id=class_.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
