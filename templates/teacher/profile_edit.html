{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Edit Profile</h2>
        <p class="page-subtitle">Update your personal information</p>
    </div>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('teacher_profile_edit') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control" type="text" id="name" name="name" value="{{ user.name }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email <span class="text-sec">(Cannot be changed)</span></label>
                <input class="form-control" type="email" id="email" name="email" value="{{ user.email }}" disabled style="background: var(--bg-alt); cursor: not-allowed;">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="subject">Subject</label>
                <input class="form-control" type="text" id="subject" name="subject" value="{{ user.subject }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="department">Department</label>
                <input class="form-control" type="text" id="department" name="department" value="{{ user.department }}" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="profile_picture">Profile Picture <span class="text-sec">(JPG, PNG, WEBP. Max 2MB)</span></label>
                <input class="form-control" type="file" id="profile_picture" name="profile_picture" accept=".jpg,.jpeg,.png,.webp" style="padding: 6px;">
            </div>
            
            <div class="flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('teacher_profile') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
