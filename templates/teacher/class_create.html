{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Create New Class</h2>
        <p class="page-subtitle">Set up a new class for attendance</p>
    </div>
</div>

<div class="card" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('teacher_class_create') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="class_name">Class Name</label>
                <input class="form-control" type="text" id="class_name" name="class_name" placeholder="e.g. Introduction to Machine Learning" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="subject">Subject</label>
                <input class="form-control" type="text" id="subject" name="subject" placeholder="e.g. CS101" required>
            </div>
            
            <div class="flex gap-4">
                <div class="form-group" style="flex:1;">
                    <label class="form-label" for="course">Course</label>
                    <input class="form-control" type="text" id="course" name="course" placeholder="e.g. B.Tech" required>
                </div>
                
                <div class="form-group" style="flex:1;">
                    <label class="form-label" for="semester">Semester</label>
                    <input class="form-control" type="text" id="semester" name="semester" placeholder="e.g. 6" required>
                </div>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Create Class</button>
                <a href="{{ url_for('teacher_classes') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
