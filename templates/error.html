{% extends 'base.html' %}

{% block content %}
<div class="auth-box" style="text-align: center; max-width: 500px;">
    <h1 style="font-size: 5rem; font-weight: 800; color: var(--danger); margin-bottom: 10px; line-height: 1;">{{ code }}</h1>
    <h2 style="font-size: 1.5rem; color: var(--text-main); margin-bottom: 16px;">Oops! Something went wrong.</h2>
    <p style="font-size: 1.1rem; color: var(--text-sec); margin-bottom: 32px;">{{ message }}</p>
    
    <a href="{{ url_for('index') }}" class="btn btn-primary" style="padding: 12px 24px; font-size: 1.1rem;">Return to Home</a>
</div>
{% endblock %}
