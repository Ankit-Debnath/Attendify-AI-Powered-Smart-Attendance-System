{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Join a Class</h2>
        <p class="page-subtitle">Enter the class code provided by your teacher</p>
    </div>
</div>

<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('student_class_join') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="class_code">Class Code</label>
                <input class="form-control" type="text" id="class_code" name="class_code" placeholder="e.g. A1B2C3" style="text-transform: uppercase; font-family: monospace; letter-spacing: 2px;" required>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Join Class</button>
                <a href="{{ url_for('student_classes') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
